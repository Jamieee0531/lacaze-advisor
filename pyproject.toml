[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lacaze-advisor"
version = "0.2.2"
description = "Private, fictional luxury client-advisor drafting workflow"
requires-python = ">=3.13"
dependencies = [
  "pydantic-ai-slim[anthropic]>=2.65,<3",
  "pydantic-settings>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
lacaze = "lacaze.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lacaze"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
